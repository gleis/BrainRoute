# Seed model registry.
#
# quality_score, speed_score and privacy_score are priors: they express what you
# believe about a model before it has run. Telemetry corrects speed and quality
# once enough requests have been observed.
#
# cost_score is NOT hand-set. It is derived from the prices below so that the
# budget policy and the cheap profile agree with what you are actually billed.
# Prices are USD per 1M tokens.

models:
  - id: local-qwen2-5
    name: Qwen3 Local
    provider: ollama
    model: qwen3:8b
    endpoint: http://localhost:11434/api/chat
    local: true
    enabled: true
    strengths:
      - coding
      - reasoning
      - summarization
      - private
    weaknesses:
      - legal
      - medical
    privacy_score: 1.0
    speed_score: 0.80
    quality_score: 0.65
    input_price_per_mtok: 0.0
    output_price_per_mtok: 0.0
    max_context: 32768

  - id: gpt-5.4-mini
    name: GPT-5.4 Mini
    provider: openai
    model: gpt-5.4-mini
    local: false
    enabled: true
    strengths:
      - general
      - coding
      - tool_use
      - writing
      - summarization
    weaknesses: []
    privacy_score: 0.40
    speed_score: 0.85
    quality_score: 0.85
    input_price_per_mtok: 0.75
    output_price_per_mtok: 4.50
    max_context: 400000

  # Placeholder for whichever frontier model you actually use. It routes as a
  # high-capability cloud option but cannot execute until you give it an
  # endpoint and api_key_env, at which point it fails fast with a clear message
  # rather than pretending to work.
  - id: premium-reasoner
    name: Premium Reasoner
    provider: openai_compatible
    provider_label: premium
    model: premium-reasoner
    api_key_env: PREMIUM_API_KEY
    local: false
    enabled: true
    strengths:
      - reasoning
      - coding
      - legal
      - long_context
    weaknesses: []
    privacy_score: 0.35
    speed_score: 0.55
    quality_score: 0.95
    input_price_per_mtok: 3.00
    output_price_per_mtok: 15.00
    max_context: 200000
