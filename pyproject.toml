[project]
name = "modelroute"
version = "0.2.0"
description = "A local-first intelligent model router for choosing the best model per task."
requires-python = ">=3.11"
authors = [{ name = "ModelRoute" }]
readme = "README.md"
license = "Apache-2.0"
dependencies = []

[project.scripts]
modelroute = "modelroute.cli:main"
modelroute-server = "modelroute.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modelroute*"]

[tool.setuptools.package-data]
modelroute = ["static/*", "defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
